<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Artifact</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --paper: #f4f6f5; --ink: #18232b; --graphite: #56636d; --rule: #d3dbdf; --wash: #e7edef;
    --redline: #c42f2a; --link: #1f5a85;
    --chrome: "Archivo", ui-sans-serif, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #151c21; --ink: #e2e8eb; --graphite: #8d9ba5; --rule: #2b3740; --wash: #212c33;
      --redline: #ff6f61; --link: #79b4e0;
    }
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--paper); color: var(--ink);
    font: 400 14px/1.4 var(--chrome); font-variant-numeric: tabular-nums;
  }
  [hidden] { display: none !important; }

  .titleblock {
    display: flex; align-items: center; gap: 14px;
    min-height: 46px; padding: 0 10px 0 18px;
    border-bottom: 1px solid var(--rule);
  }
  .titleblock h1 {
    flex: 1; min-width: 0; margin: 0;
    font-size: 15px; font-weight: 650; font-stretch: 82%; letter-spacing: .005em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .revision { display: flex; align-items: center; gap: 10px; color: var(--graphite); }
  .revision time { white-space: nowrap; font-stretch: 90%; }

  .delta { width: 30px; height: 26px; flex: none; color: var(--redline); overflow: visible; }
  .delta path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
  .delta text { fill: currentColor; font: 700 12.5px var(--chrome); font-stretch: 78%; text-anchor: middle; }
  .delta.older { color: var(--graphite); }
  .delta.fresh { animation: issued 1.4s ease-out 1; transform-origin: 50% 60%; }
  @keyframes issued {
    0% { transform: scale(1); }
    18% { transform: scale(1.45); }
    40% { transform: scale(.95); }
    60%, 100% { transform: scale(1); }
  }

  select, .titleblock a, .pinned button {
    font: 500 13px var(--chrome); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 4px; background: var(--paper);
  }
  select { padding: 4px 6px; cursor: pointer; }
  .titleblock a { padding: 4px 9px; text-decoration: none; white-space: nowrap; }
  select:hover, .titleblock a:hover, .pinned button:hover { border-color: var(--graphite); }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

  .pinned {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 18px; border-bottom: 1px solid var(--rule);
    background: var(--wash); color: var(--ink);
  }
  .pinned p { margin: 0; flex: 1; min-width: 14rem; }
  .pinned button { padding: 4px 10px; cursor: pointer; }

  main { flex: 1; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  iframe.markdown { background: transparent; }

  .notice { max-width: 30rem; margin: 16vh auto 0; padding: 0 24px; color: var(--graphite); }
  .notice .delta { width: 44px; height: 38px; margin-bottom: 14px; }
  .notice strong { display: block; margin-bottom: 6px; color: var(--ink); font-size: 19px; font-weight: 650; font-stretch: 82%; }
  .notice p { margin: 0; line-height: 1.5; }

  @media (max-width: 600px) {
    .titleblock { gap: 10px; padding-left: 12px; }
    .revision time { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .delta.fresh { animation: none; }
  }
</style>
</head>
<body>
<header class="titleblock" id="header" hidden>
  <h1 id="title"></h1>
  <div class="revision">
    <span id="mark"></span>
    <time id="published"></time>
    <select id="version" aria-label="Version"></select>
  </div>
  <a id="raw" target="_blank" rel="noreferrer">Raw file</a>
</header>
<div class="pinned" id="pinned" hidden>
  <p id="pinned-text"></p>
  <button type="button" id="show-latest">Show latest</button>
</div>
<main id="main"></main>
<script type="module">
  const MARKED = 'https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.esm.js';
  const HIGHLIGHT = 'https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/es/highlight.min.js';
  const HIGHLIGHT_STYLES = 'https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/styles/';
  const FONTS = 'https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&display=swap';
  const POLL_MS = 10000;
  const MARKDOWN_CSS = `
    :root {
      color-scheme: light dark;
      --sheet: #ffffff; --ink: #18232b; --graphite: #56636d; --rule: #d3dbdf; --wash: #eef2f3; --link: #1f5a85;
    }
    @media (prefers-color-scheme: dark) {
      :root { --sheet: #1a2228; --ink: #e2e8eb; --graphite: #8d9ba5; --rule: #2e3b44; --wash: #222d34; --link: #79b4e0; }
    }
    html { background: var(--sheet); color: var(--ink); }
    body {
      margin: 0; padding: 56px 24px 96px;
      font: 400 18px/1.7 "Source Serif 4", Charter, "Iowan Old Style", Georgia, serif;
      font-optical-sizing: auto; text-rendering: optimizeLegibility;
    }
    article { max-width: 66ch; margin: 0 auto; overflow-wrap: break-word; hyphens: auto; }
    h1, h2, h3, h4, h5, h6 {
      font-family: "Archivo", ui-sans-serif, system-ui, sans-serif; font-weight: 650;
      line-height: 1.2; margin: 2em 0 .55em; hyphens: manual; text-wrap: balance;
    }
    h1 { font-size: 2.15em; font-stretch: 78%; letter-spacing: -.01em; margin-top: 0; }
    h2 { font-size: 1.4em; font-stretch: 85%; padding-top: .9em; border-top: 1px solid var(--rule); }
    h3 { font-size: 1.12em; font-stretch: 92%; }
    h4, h5, h6 { font-size: 1em; font-stretch: 100%; }
    h1 + h2 { border-top: 0; padding-top: 0; }
    p, ul, ol, blockquote, pre, table, figure { margin: 0 0 1.1em; }
    ul, ol { padding-left: 1.4em; }
    li + li { margin-top: .3em; }
    li::marker { color: var(--graphite); }
    a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: .18em; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 2px; }
    strong { font-weight: 650; }
    img { max-width: 100%; height: auto; }
    hr { border: 0; border-top: 1px solid var(--rule); margin: 2.4em 0; }
    blockquote { margin-left: 0; padding-left: 1.1em; border-left: 2px solid var(--graphite); color: var(--graphite); font-style: italic; }
    code { font: .82em/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--wash); border-radius: 3px; padding: .12em .32em; }
    pre { background: var(--wash); border-radius: 6px; padding: 16px 18px; overflow: auto; line-height: 1.5; }
    pre code, pre code.hljs { background: transparent; padding: 0; font-size: .8em; }
    table {
      display: block; overflow: auto; border-collapse: collapse;
      font: 400 15px/1.45 "Archivo", ui-sans-serif, system-ui, sans-serif; font-variant-numeric: tabular-nums;
    }
    th, td { padding: 8px 14px 8px 0; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
    th { font-weight: 650; font-stretch: 85%; border-bottom: 1.5px solid var(--ink); }
    @media (max-width: 600px) { body { padding: 32px 18px 72px; font-size: 17px; } }
  `;

  const header = document.getElementById('header');
  const main = document.getElementById('main');
  const select = document.getElementById('version');
  const titleElement = document.getElementById('title');
  const mark = document.getElementById('mark');
  const published = document.getElementById('published');
  const raw = document.getElementById('raw');
  const pinnedBar = document.getElementById('pinned');
  const pinnedText = document.getElementById('pinned-text');
  const dateFormat = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  let artifact = null;
  let shownFile = null;

  const encodePath = (path) => path.split('/').map(encodeURIComponent).join('/');
  const escapeAttribute = (value) => value.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const latest = () => artifact.versions[artifact.versions.length - 1];
  const formatDate = (timestamp) => {
    const date = new Date(timestamp);
    return Number.isNaN(date.getTime()) ? '' : dateFormat.format(date);
  };
  const pinnedVersion = () => {
    const match = /^#v(\d+)$/.exec(location.hash);
    return match ? Number(match[1]) : null;
  };

  function revisionMark(number, older) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 30 26');
    svg.setAttribute('class', older ? 'delta older' : 'delta');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', `Version ${number}`);
    svg.innerHTML = `<path d="M15 1.5 28.5 24.5H1.5Z"/><text x="15" y="21.4">${number}</text>`;
    if (number >= 100) svg.querySelector('text').style.fontSize = '9.5px';
    return svg;
  }

  async function fetchArtifact() {
    const response = await fetch(`./artifact.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!response.ok) throw new Error(`artifact.json returned HTTP ${response.status}`);
    const data = await response.json();
    if (!Array.isArray(data.versions) || data.versions.length === 0) throw new Error('artifact.json lists no versions');
    return data;
  }

  function showNotice(heading, detail) {
    header.hidden = true;
    pinnedBar.hidden = true;
    shownFile = null;
    const notice = document.createElement('div');
    notice.className = 'notice';
    const strong = document.createElement('strong');
    strong.textContent = heading;
    const text = document.createElement('p');
    text.textContent = detail;
    const placeholder = revisionMark('?', true);
    placeholder.setAttribute('aria-hidden', 'true');
    notice.append(placeholder, strong, text);
    main.replaceChildren(notice);
  }

  function render({ fresh = false } = {}) {
    const pinned = pinnedVersion();
    const version = artifact.versions.find((entry) => entry.version === pinned);
    if (pinned !== null && !version) history.replaceState(null, '', location.pathname + location.search);
    const shown = version ?? latest();
    const isOlder = shown.version !== latest().version;
    document.title = artifact.title;
    titleElement.textContent = artifact.title;
    titleElement.title = artifact.title;

    const svg = revisionMark(shown.version, isOlder);
    if (fresh) svg.classList.add('fresh');
    mark.replaceChildren(svg);
    published.textContent = formatDate(shown.publishedAt);
    published.dateTime = shown.publishedAt;

    select.replaceChildren(
      new Option(`Latest (v${latest().version})`, ''),
      ...artifact.versions.slice().reverse().map((entry) => new Option(`v${entry.version}`, `v${entry.version}`)),
    );
    select.value = version ? `v${version.version}` : '';

    pinnedBar.hidden = !isOlder;
    if (isOlder) pinnedText.textContent = `You are viewing version ${shown.version}. Version ${latest().version} is the latest.`;

    const file = `v${shown.version}/${encodePath(shown.primary)}`;
    raw.href = file;
    header.hidden = false;
    if (file !== shownFile) {
      shownFile = file;
      showFrame(shown.primary, file).catch((error) => showNotice('This version could not be displayed.', error.message));
    }
  }

  async function showFrame(primary, file) {
    const frame = document.createElement('iframe');
    frame.title = artifact.title;
    frame.referrerPolicy = 'no-referrer';
    if (/\.md$/i.test(primary)) {
      const documentHtml = await markdownDocument(file);
      if (file !== shownFile) return;
      frame.className = 'markdown';
      frame.setAttribute('sandbox', 'allow-same-origin allow-popups allow-popups-to-escape-sandbox');
      frame.addEventListener('load', () => followInPageLinks(frame));
      frame.srcdoc = documentHtml;
    } else {
      frame.src = file;
    }
    main.replaceChildren(frame);
  }

  async function markdownDocument(file) {
    const [{ marked }, { default: hljs }, text] = await Promise.all([
      import(MARKED),
      import(HIGHLIGHT),
      fetch(file).then((response) => {
        if (!response.ok) throw new Error(`${file} returned HTTP ${response.status}`);
        return response.text();
      }),
    ]);
    const template = document.createElement('template');
    template.innerHTML = marked.parse(text);
    for (const block of template.content.querySelectorAll('pre code')) hljs.highlightElement(block);
    for (const heading of template.content.querySelectorAll('h1, h2, h3, h4, h5, h6')) {
      heading.id ||= heading.textContent.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/\s+/g, '-');
    }
    const base = new URL(file.replace(/[^/]*$/, ''), location.href).href;
    return `<!doctype html><html lang="en"><head><meta charset="utf-8">
      <meta name="referrer" content="no-referrer">
      <base href="${escapeAttribute(base)}" target="_blank">
      <link rel="stylesheet" href="${FONTS}">
      <link rel="stylesheet" href="${HIGHLIGHT_STYLES}github.min.css" media="(prefers-color-scheme: light)">
      <link rel="stylesheet" href="${HIGHLIGHT_STYLES}github-dark-dimmed.min.css" media="(prefers-color-scheme: dark)">
      <style>${MARKDOWN_CSS}</style></head><body><article>${template.innerHTML}</article></body></html>`;
  }

  // The base element points every link at the version directory, so in-page
  // anchors would otherwise open that directory in a new tab.
  function followInPageLinks(frame) {
    const frameDocument = frame.contentDocument;
    frameDocument?.addEventListener('click', (event) => {
      const link = event.target.closest?.('a[href^="#"]');
      if (!link) return;
      event.preventDefault();
      frameDocument.getElementById(decodeURIComponent(link.getAttribute('href').slice(1)))?.scrollIntoView();
    });
  }

  async function poll() {
    if (!artifact || pinnedVersion() !== null || document.visibilityState !== 'visible') return;
    try {
      const next = await fetchArtifact();
      const newVersion = next.versions[next.versions.length - 1].version !== latest().version;
      const changed = newVersion || next.title !== artifact.title;
      artifact = next;
      if (changed && pinnedVersion() === null) render({ fresh: newVersion });
    } catch {
      // Keep showing the last good state; the next poll retries.
    }
  }

  function navigate(hash) {
    history.pushState(null, '', hash ? `#${hash}` : location.pathname + location.search);
    render();
    poll();
  }

  select.addEventListener('change', () => navigate(select.value));
  document.getElementById('show-latest').addEventListener('click', () => navigate(''));
  window.addEventListener('popstate', () => artifact && render());
  window.addEventListener('hashchange', () => artifact && render());
  document.addEventListener('visibilitychange', poll);
  setInterval(poll, POLL_MS);

  try {
    artifact = await fetchArtifact();
    render();
  } catch (error) {
    showNotice('This artifact is not available.', `Its version list could not be loaded: ${error.message}`);
  }
</script>
</body>
</html>
