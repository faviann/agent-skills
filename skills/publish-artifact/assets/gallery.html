<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Published artifacts</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --paper: #f4f6f5; --ink: #18232b; --graphite: #56636d; --rule: #d3dbdf; --wash: #e7edef;
    --redline: #c42f2a; --link: #1f5a85;
    --chrome: "Archivo", ui-sans-serif, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #151c21; --ink: #e2e8eb; --graphite: #8d9ba5; --rule: #2b3740; --wash: #212c33;
      --redline: #ff6f61; --link: #79b4e0;
    }
  }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 15px/1.45 var(--chrome); font-variant-numeric: tabular-nums;
  }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

  .register { max-width: 58rem; margin: 0 auto; padding: 56px 24px 96px; }
  .masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 40px; }
  h1 { margin: 0; font-size: 44px; line-height: 1; font-weight: 700; font-stretch: 68%; letter-spacing: -.01em; }
  .summary { margin: 10px 0 0; color: var(--graphite); }
  input {
    width: min(22rem, 100%); box-sizing: border-box; padding: 8px 12px;
    font: 400 15px var(--chrome); color: var(--ink);
    background: var(--paper); border: 1px solid var(--rule); border-radius: 4px;
  }
  input::placeholder { color: var(--graphite); }
  input:hover { border-color: var(--graphite); }

  section + section { margin-top: 36px; }
  h2 {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 0; padding-bottom: 8px; border-bottom: 1.5px solid var(--ink);
    font-size: 17px; font-weight: 650; font-stretch: 85%;
  }
  h2 span { font-size: 14px; font-weight: 400; color: var(--graphite); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-bottom: 1px solid var(--rule); }
  li a {
    display: grid; grid-template-columns: 36px minmax(0, 1fr) minmax(0, 13rem) 8.5rem; align-items: center; gap: 0 16px;
    padding: 11px 8px; color: inherit; text-decoration: none;
  }
  li a:hover { background: var(--wash); }
  li a:hover .title { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .2em; }
  .title { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .producer, .updated { color: var(--graphite); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .updated { text-align: right; }

  .delta { width: 30px; height: 26px; color: var(--redline); overflow: visible; }
  .delta path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
  .delta text { fill: currentColor; font: 700 12.5px var(--chrome); font-stretch: 78%; text-anchor: middle; }

  .notice { margin: 12vh 0 0; max-width: 28rem; color: var(--graphite); line-height: 1.5; }
  .notice strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 18px; font-weight: 650; font-stretch: 85%; }

  @media (max-width: 640px) {
    .register { padding: 32px 16px 72px; }
    h1 { font-size: 34px; }
    li a { grid-template-columns: 34px minmax(0, 1fr) auto; grid-template-rows: auto auto; padding: 10px 4px; }
    .delta { grid-row: span 2; }
    .title { grid-column: 2 / 4; }
    .producer { grid-column: 2; }
    .updated { grid-column: 3; }
  }
</style>
</head>
<body>
<div class="register">
  <header class="masthead">
    <div>
      <h1>Published artifacts</h1>
      <p class="summary" id="summary"></p>
    </div>
    <input id="filter" type="search" placeholder="Filter by title, repository, or producer" aria-label="Filter artifacts">
  </header>
  <main id="main"></main>
</div>
<script type="module">
  const main = document.getElementById('main');
  const summary = document.getElementById('summary');
  const filter = document.getElementById('filter');
  const relative = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
  const units = [['year', 31536000], ['month', 2592000], ['week', 604800], ['day', 86400], ['hour', 3600], ['minute', 60]];
  let artifacts = [];

  const plural = (count, word) => `${count} ${word}${count === 1 ? '' : 's'}`;

  function ago(timestamp) {
    const seconds = (Date.parse(timestamp) - Date.now()) / 1000;
    if (Number.isNaN(seconds)) return '';
    for (const [unit, size] of units) {
      if (Math.abs(seconds) >= size) return relative.format(Math.round(seconds / size), unit);
    }
    return 'just now';
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function revisionMark(number) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 30 26');
    svg.setAttribute('class', 'delta');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', plural(number, 'version'));
    svg.innerHTML = `<path d="M15 1.5 28.5 24.5H1.5Z"/><text x="15" y="21.4">${number}</text>`;
    if (number >= 100) svg.querySelector('text').style.fontSize = '9.5px';
    return svg;
  }

  function notice(heading, detail) {
    const box = element('div', 'notice');
    box.append(element('strong', '', heading), detail);
    main.replaceChildren(box);
  }

  function render() {
    const query = filter.value.trim().toLowerCase();
    const matches = artifacts.filter((artifact) =>
      [artifact.title, artifact.slug, artifact.producer, artifact.repository].some((field) => String(field).toLowerCase().includes(query)));
    if (artifacts.length === 0) {
      notice('Nothing published yet.', 'Artifacts appear here after their first publication.');
      return;
    }
    if (matches.length === 0) {
      notice(`No artifact matches “${filter.value.trim()}”.`, 'Try part of a title, a repository name, or a producer.');
      return;
    }
    const groups = new Map();
    for (const artifact of matches) {
      if (!groups.has(artifact.repository)) groups.set(artifact.repository, []);
      groups.get(artifact.repository).push(artifact);
    }
    main.replaceChildren(...[...groups].map(([repository, entries]) => {
      const heading = element('h2', '', repository);
      heading.append(element('span', '', String(entries.length)));
      const list = element('ul');
      for (const artifact of entries) {
        const link = element('a');
        link.href = artifact.url;
        link.rel = 'noreferrer';
        const updated = element('span', 'updated', ago(artifact.updatedAt));
        updated.title = artifact.updatedAt;
        link.append(revisionMark(artifact.versions), element('span', 'title', artifact.title), element('span', 'producer', artifact.producer), updated);
        const item = element('li');
        item.append(link);
        list.append(item);
      }
      const section = element('section');
      section.append(heading, list);
      return section;
    }));
  }

  filter.addEventListener('input', render);
  try {
    const response = await fetch(`./gallery.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!response.ok) throw new Error(`gallery.json returned HTTP ${response.status}`);
    artifacts = await response.json();
    const repositories = new Set(artifacts.map((artifact) => artifact.repository)).size;
    summary.textContent = `${plural(artifacts.length, 'artifact')} across ${plural(repositories, 'repository').replace(/ys$/, 'ies')}`;
    render();
  } catch (error) {
    notice('The gallery could not be loaded.', `gallery.json did not load: ${error.message}`);
  }
</script>
</body>
</html>
